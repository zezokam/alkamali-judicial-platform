<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار - المرجع القضائي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 2rem;
            text-align: center;
        }
        .test-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            font-size: 1.1rem;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="test-box">
        <h1>🎉 اختبار نجح!</h1>
        <p class="success">الموقع يعمل بشكل صحيح الآن</p>
        <p>هذا يعني أن المشكلة تم حلها وأن التحديثات تصل بشكل صحيح</p>
        <p><strong>التاريخ:</strong> 6 أكتوبر 2025</p>
        <p><strong>الوقت:</strong> <span id="time"></span></p>
    </div>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleTimeString('ar-SA');
    </script>
</body>
</html>
