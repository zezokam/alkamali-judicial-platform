<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسودات الأحكام - المرجع القضائي</title>
    <link rel="stylesheet" href="../css/unified-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .judgments-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .search-section {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .search-filters {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .judgments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .judgment-card {
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 4px solid var(--primary-color);
        }
        
        .judgment-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        
        .judgment-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .judgment-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .meta-tag {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .meta-court {
            background: var(--primary-light);
            color: var(--primary-dark);
        }
        
        .meta-date {
            background: var(--success-color);
            color: white;
        }
        
        .judgment-notes {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        
        .judgment-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .btn-download {
            background: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-download:hover {
            background: var(--primary-dark);
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }
        
        .court-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .search-filters {
                grid-template-columns: 1fr;
            }
            
            .judgments-grid {
                grid-template-columns: 1fr;
            }
            
            .judgments-container {
                padding: 1rem;
            }
            
            .court-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

                    <button onclick="clearFilters()" class="btn-outline">
                        <i class="fas fa-times"></i> مسح الفلاتر
                    </button>
                </div>
            </div>

            <div id="judgmentsContainer">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل مسودات الأحكام...
                </div>
            </div>
        </div>
    </main>

        let filteredJudgments = [...judgmentDrafts];

        function renderCourtStats() {
            const stats = {};
            judgmentDrafts.forEach(judgment => {
                stats[judgment.court] = (stats[judgment.court] || 0) + 1;
            });

            const statsContainer = document.getElementById('courtStats');
            const statsHTML = Object.entries(stats).map(([court, count]) => `
                <div class="stat-card">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">${court}</div>
                </div>
            `).join('');

            statsContainer.innerHTML = statsHTML;
        }

        function renderJudgments(judgments) {
            const container = document.getElementById('judgmentsContainer');
            
            if (judgments.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; color: var(--text-muted);"></i>
                        <h3>لا توجد نتائج</h3>
                        <p>لم يتم العثور على مسودات أحكام تطابق معايير البحث المحددة</p>
                    </div>
                `;
                return;
            }

            const judgmentsHTML = judgments.map(judgment => `
                <div class="judgment-card">
                    <h3 class="judgment-title">${judgment.title}</h3>
                    <div class="judgment-meta">
                        <span class="meta-tag meta-court">
                            <i class="fas fa-gavel"></i> ${judgment.court}
                        </span>
                        <span class="meta-tag meta-date">
                            <i class="fas fa-calendar"></i> ${new Date(judgment.date).toLocaleDateString('ar-SA')}
                        </span>
                    </div>
                    <div class="judgment-notes">
                        ${judgment.notes}
                    </div>
                    <div class="judgment-actions">
                        ${judgment.hasFile ? 
                            '<a href="#" class="btn-download"><i class="fas fa-download"></i> تحميل المسودة</a>' : 
                            '<span style="color: var(--text-muted); font-size: 0.8rem;"><i class="fas fa-info-circle"></i> لا يوجد ملف مرفق</span>'
                        }
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="judgments-grid">${judgmentsHTML}</div>`;
        }

        function searchJudgments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const courtFilter = document.getElementById('courtFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            filteredJudgments = judgmentDrafts.filter(judgment => {
                const matchesSearch = !searchTerm || 
                    judgment.title.toLowerCase().includes(searchTerm) ||
                    judgment.notes.toLowerCase().includes(searchTerm);
                
                const matchesCourt = !courtFilter || judgment.court === courtFilter;
                const matchesYear = !yearFilter || judgment.date.startsWith(yearFilter);

                return matchesSearch && matchesCourt && matchesYear;
            });

            renderJudgments(filteredJudgments);
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('courtFilter').value = '';
            document.getElementById('yearFilter').value = '';
            filteredJudgments = [...judgmentDrafts];
            renderJudgments(filteredJudgments);
        }

        // إضافة مستمعي الأحداث
        document.getElementById('searchInput').addEventListener('input', searchJudgments);
        document.getElementById('courtFilter').addEventListener('change', searchJudgments);
        document.getElementById('yearFilter').addEventListener('change', searchJudgments);

        // تحميل البيانات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            renderCourtStats();
            setTimeout(() => {
                renderJudgments(filteredJudgments);
            }, 500);
        });
